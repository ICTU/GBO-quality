# SonarQube-configuratie. Gebruik het standaardprofiel "Sonar way" (ICTU Kwaliteitsaanpak).
sonar.projectKey=gbo-COMPONENTNAAM
sonar.projectName=GBO COMPONENTNAAM
sonar.sources=.
sonar.exclusions=**/testdata/**,**/vendor/**,**/node_modules/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/test_*.py,**/src/test/**

# Dekkingsrapport van het testcommando, kies wat past:
# sonar.go.coverage.reportPaths=coverage.out
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
