# git-cliff: release notes uit Conventional Commits.
[changelog]
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Niet uitgebracht{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking change**){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Nieuw" },
  { message = "^fix", group = "<!-- 1 -->Opgelost" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^sec|^security", group = "<!-- 3 -->Beveiliging" },
  { message = "^docs", group = "<!-- 4 -->Documentatie" },
  { message = "^refactor", group = "<!-- 5 -->Onderhoud" },
  { message = "^(chore|ci|build|test|style)", skip = true },
]
tag_pattern = "v[0-9].*"
