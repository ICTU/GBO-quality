# Release bij een versietag. Maak een release met: git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    uses: ICTU/GBO-quality/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build-command: ""      # bijv. "make dist"
      artifact-paths: ""     # bijv. "dist/*"
      dependency-track-url: ${{ vars.DT_URL }}
    secrets: inherit
