# Herbruikbare workflow: release bij een versietag (vX.Y.Z).
# Levert release notes, SBOM, testrapport en een bewijsbundel, met build-provenance.
# ICTU Kwaliteitsaanpak: M01 (release notes, SBOM, deploybare versie), M07 (oplevering), M27 (archivering).
# Kwaliteitsplan §4 (testrapport per release), §6 (vrijgave), §8.1 (bewijs bewaren), §8.8 (overdracht).
#
# De bewijsbundel (bewijs-<tag>.zip) bevat testrapport, testresultaten, kwetsbaarhedenscan, SBOM,
# gemergde pull requests met reviewers, openstaande bugs, release notes en een SHA-256-manifest.
# Zet in de repository "immutable releases" aan, zodat release en bundel niet meer te wijzigen zijn.
name: GBO release

on:
  workflow_call:
    inputs:
      quality-ref:
        description: Versie (tag/branch/sha) van ICTU/GBO-quality waarvan de scripts worden gebruikt.
        type: string
        default: v0
      build-command:
        description: Bouwt de release-artefacten (optioneel).
        type: string
        default: ""
      artifact-paths:
        description: Artefacten (glob, één per regel) om aan de release te hangen en te attesteren (optioneel).
        type: string
        default: ""
      test-command:
        description: >-
          Draait de geautomatiseerde tests op de getagde versie en schrijft JUnit-XML (optioneel, sterk
          aanbevolen). Faalt een test, dan wordt de release niet gemaakt.
        type: string
        default: ""
      junit-paden:
        description: Globs (één per regel) van de JUnit-XML-bestanden die test-command schrijft.
        type: string
        default: |
          **/junit*.xml
          **/TEST-*.xml
      testgevallen-map:
        description: Map met de logische testgevallen, voor de traceerbaarheid in het testrapport.
        type: string
        default: docs/testgevallen
      ltc-patroon:
        description: Reguliere expressie voor het ID van een logisch testgeval.
        type: string
        default: 'GBO-LTC-\d+'
      rollback-bestand:
        description: Rollbackinstructie die in de release notes en het testrapport komt.
        type: string
        default: docs/rollback.md
      tag-patroon:
        description: Patroon voor tags van deze component, om de vorige release te vinden (bijv. "ootsadapter/v*").
        type: string
        default: "v*"
      git-cliff-version:
        type: string
        default: "2.6.1"
      trivy-version:
        type: string
        default: "0.58.1"
      dependency-track-url:
        type: string
        default: ""
      dependency-track-project:
        type: string
        default: ""
    secrets:
      DT_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release aanmaken
      id-token: write       # build-provenance
      attestations: write   # build-provenance
      pull-requests: read   # reviews voor de bewijsbundel
      issues: read          # openstaande bugs voor het testrapport
    env:
      TAG: ${{ github.ref_name }}
      BEWIJS: .bewijs
      TRIVY_IMAGE: aquasec/trivy:${{ inputs.trivy-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scripts ophalen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ICTU/GBO-quality
          ref: ${{ inputs.quality-ref }}
          path: .gbo-quality

      - name: Bestandsnamen bepalen
        run: |
          # Een tag als "ootsadapter/v1.2.0" levert bestandsnamen met "ootsadapter-v1.2.0".
          echo "VERSIE=${TAG//\//-}" >> "$GITHUB_ENV"
          mkdir -p "$BEWIJS/junit"

      - name: Bouwen
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Tests op de getagde versie
        id: tests
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          JUNIT_PADEN: ${{ inputs.junit-paden }}
        run: |
          set +e
          bash -c "$TEST_COMMAND"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          shopt -s globstar nullglob
          n=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for f in $pattern; do
              case "$f" in .gbo-quality/*|"$BEWIJS"/*) continue ;; esac
              n=$((n + 1)); cp "$f" "$BEWIJS/junit/$n-$(basename "$f")"
            done
          done <<< "$JUNIT_PADEN"
          echo "$n JUnit-bestand(en) verzameld."

      - name: Vorige release bepalen
        env:
          TAG_PATTERN: ${{ inputs.tag-patroon }}
        run: |
          vorige="$(git describe --tags --abbrev=0 --match "$TAG_PATTERN" "${TAG}^" 2>/dev/null || true)"
          echo "VORIGE_TAG=$vorige" >> "$GITHUB_ENV"
          echo "Vorige release: ${vorige:-geen}"

      - name: Release notes (git-cliff, uit Conventional Commits)
        env:
          CLIFF_VERSION: ${{ inputs.git-cliff-version }}
          ROLLBACK: ${{ inputs.rollback-bestand }}
        run: |
          pipx run "git-cliff==$CLIFF_VERSION" --latest --strip header --output RELEASE_NOTES.md
          if [ -f "$ROLLBACK" ]; then
            { echo; echo "## Rollback"; echo; cat "$ROLLBACK"; } >> RELEASE_NOTES.md
          else
            echo "::warning::Geen rollbackinstructie ($ROLLBACK); kwaliteitsplan §8.8 vraagt die bij elke release."
          fi
          { echo; echo "Testrapport en bewijsbundel: zie de bijlagen van deze release."; } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: SBOM en kwetsbaarhedenscan (Trivy)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --skip-dirs .gbo-quality,.bewijs --format cyclonedx --output "sbom-${VERSIE}.cdx.json" --no-progress .
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --skip-dirs .gbo-quality,.bewijs --scanners vuln --format json --output "$BEWIJS/trivy.json" \
            --no-progress .

      - name: Pull requests, reviews en openstaande bugs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .gbo-quality/scripts/verzamel_releasegegevens.py "$VORIGE_TAG" "$TAG" "$BEWIJS"

      - name: Testrapport
        env:
          TESTGEVALLEN: ${{ inputs.testgevallen-map }}
          LTC_PATROON: ${{ inputs.ltc-patroon }}
          ROLLBACK: ${{ inputs.rollback-bestand }}
        run: |
          args=()
          [ -n "$(ls -A "$BEWIJS/junit")" ] && args+=(--junit "$BEWIJS/junit")
          python3 .gbo-quality/scripts/testrapport.py --tag "$TAG" --vorige-tag "$VORIGE_TAG" \
            --trivy "$BEWIJS/trivy.json" --trivyignore .trivyignore \
            --prs "$BEWIJS/prs.json" --bugs "$BEWIJS/bugs.json" \
            --testgevallen "$TESTGEVALLEN" --ltc-patroon "$LTC_PATROON" --rollback "$ROLLBACK" \
            --uit "testrapport-${VERSIE}.md" "${args[@]}"
          cat "testrapport-${VERSIE}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Bewijsbundel samenstellen
        env:
          ROLLBACK: ${{ inputs.rollback-bestand }}
        run: |
          cp "testrapport-${VERSIE}.md" "sbom-${VERSIE}.cdx.json" RELEASE_NOTES.md "$BEWIJS/"
          [ -f .trivyignore ] && cp .trivyignore "$BEWIJS/trivyignore.txt"
          [ -f "$ROLLBACK" ] && cp "$ROLLBACK" "$BEWIJS/rollback.md"
          {
            echo "Bewijsbundel $TAG"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow-run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Gemaakt: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$BEWIJS/HERKOMST.txt"
          (cd "$BEWIJS" && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifest")
          mv "$RUNNER_TEMP/manifest" "$BEWIJS/MANIFEST.sha256"
          (cd "$BEWIJS" && zip -qr "../bewijs-${VERSIE}.zip" .)

      - name: Release tegenhouden bij falende tests
        if: steps.tests.outputs.status != '' && steps.tests.outputs.status != '0'
        run: |
          echo "::error::De tests op $TAG falen; de release wordt niet gemaakt. Zie het testrapport in de samenvatting."
          exit 1

      - name: Bestanden voor de release verzamelen
        env:
          ARTIFACTS: ${{ inputs.artifact-paths }}
        run: |
          {
            echo "sbom-${VERSIE}.cdx.json"
            echo "testrapport-${VERSIE}.md"
            echo "bewijs-${VERSIE}.zip"
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              for f in $pattern; do [ -f "$f" ] && echo "$f"; done
            done <<< "$ARTIFACTS"
          } > release-bestanden.txt
          cat release-bestanden.txt

      - name: Build-provenance attesteren
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom-*.cdx.json
            testrapport-*.md
            bewijs-*.zip
            ${{ inputs.artifact-paths }}

      - name: GitHub-release aanmaken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < release-bestanden.txt
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag "${files[@]}"

      - name: SBOM naar Dependency-Track
        env:
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          DT_URL: ${{ inputs.dependency-track-url }}
          DT_PROJECT: ${{ inputs.dependency-track-project || github.event.repository.name }}
        run: |
          if [ -z "$DT_API_KEY" ] || [ -z "$DT_URL" ]; then
            echo "::warning::Dependency-Track overgeslagen: DT_API_KEY of dependency-track-url ontbreekt."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=$DT_PROJECT" \
            -F "projectVersion=$TAG" \
            -F "bom=@sbom-${VERSIE}.cdx.json"
